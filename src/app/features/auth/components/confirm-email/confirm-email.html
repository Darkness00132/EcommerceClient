<app-auth-card [title]="title() | transloco" [subtitle]="subtitle() | transloco">
  <div class="text-center">
    @if (!verified()) {
      <button
        mat-flat-button
        color="primary"
        class="mt-2 h-12 w-full rounded-xl font-semibold shadow-sm transition-all hover:shadow-md"
        (click)="verifyEmail()"
        [disabled]="loading()"
      >
        @if (loading()) {
          <div class="flex justify-center">
            <mat-spinner diameter="22"></mat-spinner>
          </div>
        } @else {
          {{ 'auth.verify_email.verify_button' | transloco }}
        }
      </button>
    } @else {
      <button
        mat-flat-button
        color="primary"
        class="mt-2 h-12 w-full rounded-xl font-semibold shadow-sm transition-all hover:shadow-md"
        routerLink="/auth/login"
      >
        {{ 'auth.verify_email.sign_in_button' | transloco }}
      </button>
    }
  </div>
</app-auth-card>
