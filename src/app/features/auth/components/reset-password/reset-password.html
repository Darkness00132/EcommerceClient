<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <form (ngSubmit)="onSubmit()" class="w-full max-w-md">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm">
      <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-900">Reset password</h1>

        <p class="mt-2 text-sm text-gray-600">Choose a new password for your account.</p>
      </div>

      <div class="space-y-5">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>New password</mat-label>

          <input
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            [formControl]="newPassword"
            autocomplete="new-password"
          />

          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
            <mat-icon>
              {{ hidePassword() ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>

          @if (newPassword.touched && newPassword.hasError('required')) {
            <mat-error>Password is required.</mat-error>
          }

          @if (newPassword.touched && newPassword.hasError('minlength')) {
            <mat-error>Password must be at least 8 characters.</mat-error>
          }
        </mat-form-field>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="!w-full !h-11"
          [disabled]="loading()"
        >
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Reset Password
          }
        </button>
      </div>
    </div>
  </form>
</div>
