<app-auth-card
  [title]="'auth.reset_password.title' | transloco"
  [subtitle]="'auth.reset_password.subtitle' | transloco"
>
  <form (ngSubmit)="onSubmit()" class="w-full space-y-5">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>
        {{ 'auth.reset_password.new_password' | transloco }}
      </mat-label>

      <input
        matInput
        [type]="hidePassword() ? 'password' : 'text'"
        [formControl]="newPassword"
        autocomplete="new-password"
      />

      <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
        <mat-icon>
          {{ hidePassword() ? 'visibility_off' : 'visibility' }}
        </mat-icon>
      </button>

      @if (newPassword.touched && newPassword.hasError('required')) {
        <mat-error>
          {{ 'shared.password_required' | transloco }}
        </mat-error>
      }

      @if (newPassword.touched && newPassword.hasError('minlength')) {
        <mat-error>
          {{ 'shared.password_minlength' | transloco }}
        </mat-error>
      }
    </mat-form-field>

    <button
      mat-flat-button
      color="primary"
      type="submit"
      class="mt-3 h-12 w-full rounded-xl font-semibold shadow-sm transition-all hover:shadow-md"
      [disabled]="loading()"
    >
      @if (loading()) {
        <div class="flex justify-center">
          <mat-spinner diameter="22"></mat-spinner>
        </div>
      } @else {
        {{ 'auth.reset_password.submit' | transloco }}
      }
    </button>
  </form>
</app-auth-card>
