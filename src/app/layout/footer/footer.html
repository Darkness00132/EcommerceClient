<footer class="border-t border-gray-200 bg-white">
  <div
    class="mx-auto flex w-full max-w-7xl flex-col gap-8 px-6 py-10 sm:px-8 lg:flex-row lg:items-center lg:justify-between"
  >
    <!-- Brand -->
    <div>
      <h2 class="text-xl font-bold tracking-tight text-gray-900">Ecommerce</h2>

      <p class="mt-2 text-sm text-gray-600">
        {{ 'footer.description' | transloco }}
      </p>
    </div>

    <!-- Newsletter -->
    <div class="w-full max-w-md">
      <h3 class="text-sm font-semibold text-gray-900">
        {{ 'footer.newsletter_title' | transloco }}
      </h3>

      <p class="mt-1 text-sm text-gray-600">
        {{ 'footer.newsletter_description' | transloco }}
      </p>

      <form class="mt-4 flex gap-2">
        <mat-form-field appearance="outline" class="flex-1">
          <mat-label>
            {{ 'footer.email_placeholder' | transloco }}
          </mat-label>

          <input matInput type="email" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="h-14 rounded-xl px-6">
          {{ 'footer.subscribe' | transloco }}
        </button>
      </form>
    </div>
  </div>

  <!-- Bottom -->
  <div class="border-t border-gray-100 py-4 text-center text-sm text-gray-500">
    {{ 'footer.copyright' | transloco }}
  </div>
</footer>
